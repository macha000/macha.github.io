<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>마차</title>

<style>
body{
    background:#ffffff;
    color:#222;
    font-family: "Noto Serif KR", serif;
    line-height:1.9;
    margin:0;
}

.container{
    max-width:700px;
    margin:0 auto;
    padding:100px 30px;
}

h1{
    font-size:42px;
    font-weight:400;
    margin-bottom:40px;
}

h2{
    font-size:24px;
    font-weight:400;
    margin-top:120px;
    margin-bottom:30px;
}

p{
    margin-bottom:20px;
}

.article{
    margin-bottom:30px;
}

.product{
    margin-bottom:50px;
}

a{
    color:#222;
    text-decoration:none;
    border-bottom:1px solid #ddd;
}

a:hover{
    border-bottom:1px solid #222;
}
</style>

</head>

<body>

<div class="container">

<h1>마차</h1>

<p>
생각을 기록하고,
좋은 것들을 천천히 소개합니다.
</p>

<h2>소개</h2>

<p>
빠르게 소비되는 정보보다
오래 남는 생각을 좋아합니다.

이 공간에는 글과 상품,
그리고 삶에 대한 기록이 담깁니다.
</p>

<h2>최근 글</h2>

<div class="article">
<p><strong>여백에 대하여</strong></p>
<p>
비워진 공간은 부족함이 아니라
생각이 머무를 자리일지도 모릅니다.
</p>
</div>

<div class="article">
<p><strong>천천히 걷는 이유</strong></p>
<p>
속도보다 방향이 중요하다고 믿습니다.
</p>
</div>

<h2>상품</h2>

<div class="product">
<p><strong>전자책</strong></p>
<p>
삶과 일에 관한 기록.
</p>
</div>

<div class="product">
<p><strong>워크북</strong></p>
<p>
생각을 정리하기 위한 질문들.
</p>
</div>

<h2>연락처</h2>

<p>
hello@example.com
</p>

</div>

</body>
</html>
